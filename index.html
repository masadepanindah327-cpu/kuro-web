<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuro — 2D Interactive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #121216; color: #fff; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    #character-container {
      position: relative;
      width: 100vw;
      height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #kuro-img {
      height: 100%;
      max-width: 100vw;
      object-fit: contain;
      transition: transform 0.1s ease-out;
      pointer-events: none;
    }

    .hitbox {
      position: absolute;
      cursor: pointer;
      z-index: 5;
    }
    
    #hit-head { top: 5%; left: 30%; width: 40%; height: 25%; }
    #hit-chest { top: 30%; left: 25%; width: 50%; height: 25%; }
    #hit-hair { top: 10%; left: 15%; width: 70%; height: 50%; }
    #hit-body { top: 55%; left: 20%; width: 60%; height: 40%; }

    #chat-container { width: 100%; height: 35vh; background: #121216; display: flex; flex-direction: column; border-top: 1px solid #4a2c5e; z-index: 10; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; animation: fadeIn 0.3s ease; word-wrap: break-word; }
    .message.user { align-self: flex-end; background: #6a4c8e; color: #fff; border-bottom-right-radius: 4px; }
    .message.kuro { align-self: flex-start; background: #2a2a35; color: #d1c4e9; border: 1px solid #4a2c5e; border-bottom-left-radius: 4px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    #chat-input-area { display: flex; padding: 10px; background: #1a1a24; gap: 8px; }
    #chat-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #4a2c5e; background: #121216; color: #fff; font-size: 14px; outline: none; }
    #send-btn { padding: 0 20px; border-radius: 8px; border: none; background: #6a4c8e; color: white; font-weight: bold; cursor: pointer; }
    #send-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="character-container">
    <!-- GANTI URL DI BAWAH INI PAKAI LINK GAMBAR KARAKTER YANG LO MAU -->
    <img id="kuro-img" src="https://i.ibb.co/6PZzXqz/kuro-placeholder.jpg" alt="Kuro">
    
    <div class="hitbox" id="hit-head" data-part="head"></div>
    <div class="hitbox" id="hit-chest" data-part="chest"></div>
    <div class="hitbox" id="hit-hair" data-part="hair"></div>
    <div class="hitbox" id="hit-body" data-part="body"></div>
  </div>

  <div id="chat-container">
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Katakan sesuatu pada Kuro..." autocomplete="off">
      <button id="send-btn">Kirim</button>
    </div>
  </div>
  
  <script src="/app2d.js"></script>
</body>
</html>
